<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="128" viewBox="0 0 512 128" role="img" aria-label="CCmarket logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f513f"/>
      <stop offset="100%" stop-color="#3A5A40"/>
    </linearGradient>
  </defs>
  <!-- Badge -->
  <g transform="translate(16,16)">
    <rect x="0" y="0" rx="12" ry="12" width="96" height="96" fill="url(#g)"/>
    <!-- Simple cart icon -->
    <g transform="translate(18,22)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8h18l10 32h32l8-20H30"/>
      <circle cx="30" cy="70" r="6" fill="#ffffff"/>
      <circle cx="58" cy="70" r="6" fill="#ffffff"/>
    </g>
  </g>
  <!-- Wordmark -->
  <g transform="translate(128,30)">
    <text x="0" y="34" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#FFD700" opacity="1">CC</text>
    <text x="70" y="34" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#e9f5ec">market</text>
    <!-- underline accent -->
    <rect x="0" y="48" width="210" height="6" rx="3" fill="#2f513f"/>
  </g>
</svg>
